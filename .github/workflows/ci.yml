name: CI

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  security-events: write

jobs:
  lint-and-types:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next.js 16 tipa layouts/pages/rutas con tipos auto-generados (p. ej.
      # LayoutProps<"/">) que viven en .next/types/ — nunca se commitean y no
      # existen en un checkout fresco de CI. `next typegen` los genera sin
      # necesitar un build completo; sin este paso, `tsc --noEmit` falla con
      # "Cannot find name 'LayoutProps'" aunque el código esté bien.
      - run: npx next typegen
      - run: npx tsc --noEmit

  dependency-audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El npm que trae Node 22 en el runner sigue usando el endpoint de
      # auditoría que npm está retirando — falla con "400 Bad Request /
      # Invalid package tree" (mensaje engañoso: no es el lockfile, es el
      # endpoint viejo). Actualizar npm antes de auditar usa el endpoint
      # nuevo. `npm ci` ya corrió arriba con el npm original del runner,
      # sin depender de esta actualización.
      - run: npm install -g npm@latest
      - run: npm audit --audit-level=high

  codeql:
    name: Análisis de seguridad del código (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  build:
    name: Build de prueba
    runs-on: ubuntu-latest
    needs: [lint-and-types]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
