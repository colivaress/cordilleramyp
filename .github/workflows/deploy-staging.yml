name: Deploy a Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy a staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones al Supabase de staging
        uses: supabase/setup-cli@v1
        with:
          # Versión fija (la misma que corre en local — `supabase --version`),
          # no "latest": con "latest" la acción consulta la API de GitHub sin
          # autenticar para resolver el último release, y esa consulta puede
          # fallar por rate limit (60/hora sin token, compartido entre todos
          # los runners de GitHub) — fue justo lo que rompió este workflow.
          # Fijarla de paso evita que CI corra un binario distinto al
          # probado en local sin ningún commit que lo explique.
          version: 2.117.0
        env:
          # Red por si igual llega a consultar la API de GitHub: autenticado
          # el límite sube de 60 a 5000 por hora. GITHUB_TOKEN lo provee
          # Actions solo, no hace falta crear ningún secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      - name: Descargar configuración del proyecto (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a Vercel (preview/staging)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Asignar alias fijo de staging
        # cordilleramyp-staging.vercel.app siempre apunta al último deploy de
        # develop — evita ir a buscar la URL con hash al log de cada corrida.
        run: vercel alias set ${{ steps.deploy.outputs.url }} cordilleramyp-staging.vercel.app --token=${{ secrets.VERCEL_TOKEN }}
