name: Deploy a Producción

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy a producción
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar migraciones al Supabase de producción
        uses: supabase/setup-cli@v1
        with:
          # Versión fija (la misma que corre en local — `supabase --version`),
          # no "latest": con "latest" la acción consulta la API de GitHub sin
          # autenticar para resolver el último release, y esa consulta puede
          # fallar por rate limit (60/hora sin token, compartido entre todos
          # los runners de GitHub) — fue justo lo que rompió el mismo paso en
          # deploy-staging. Fijarla de paso evita que CI corra un binario
          # distinto al probado en local sin ningún commit que lo explique.
          version: 2.117.0
        env:
          # Red por si igual llega a consultar la API de GitHub: autenticado
          # el límite sube de 60 a 5000 por hora. GITHUB_TOKEN lo provee
          # Actions solo, no hace falta crear ningún secret.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Instalar Vercel CLI
        # Versión fija, no "latest": ver el comentario en deploy-staging.yml
        # — la CLI saltó sola de 59.23.2 (compilaba bien) a 59.25.2 (rompe el
        # build con "ENOENT .../.next/next-server.js.nft.json") entre dos
        # corridas de staging, sin ningún commit de este repo entre medio.
        run: npm install --global vercel@59.23.2

      - name: Descargar configuración del proyecto (producción)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy a Vercel (producción)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
